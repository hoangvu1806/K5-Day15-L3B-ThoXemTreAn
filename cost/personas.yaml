# Mô phỏng chi phí khi dùng thật — điền ở guide bước 4.2.
# Ôn lại: ngày 13, ngày 1, ngày 14 · lab ngày 13, lab ngày 14.
# Mọi số phải có nguồn (data / phỏng vấn / khảo sát / quy mô khoá có nguồn) hoặc ghi rõ "(tự ước tính)".
# Chạy: python run.py simulate --try   (10 phiên, kiểm khung — làm trước CP3)
#       python run.py simulate         (đủ số phiên dưới đây — bản nộp CP4)
# Đã thay hết số mẫu bằng số và nguồn của nhóm (28/11).

sessions: 50        # số phiên mô phỏng — bản nộp ≥50
seed: 42            # giữ cố định để chạy lại ra cùng chuỗi phiên

users:              # số người dùng thật nếu đưa vào dùng — 3 kịch bản, ở quy mô thật của sản phẩm
                    # track A: khoá học · track B–F: người dùng của sản phẩm / nhóm nhắm tới, nguồn công khai có link
  low: 500
  base: 2000
  high: 10000
  source: "(tự ước tính) Một người dùng là một phụ huynh hoặc một giáo viên. Mốc so sánh: năm học 2025-2026 cả nước có khoảng 19,08 triệu học sinh phổ thông (Bộ GD&ĐT, https://giaoduc.net.vn/ban-in/post262421.gd, xem 28/11/2026). Thấp 500 = thử qua nhóm Zalo phụ huynh và vài lớp quen; cơ sở 2.000 = vài trường tiểu học, THCS dùng; cao 10.000 = một quận, huyện. Cả ba số là tự ước tính, chưa có số người dùng thật."

personas:           # ≥3 kiểu người dùng; share cộng lại = 1
  # share chia trên 18 phiếu sẽ cho trẻ chơi ở câu 7 (6 + 10 + 2). 2/20 phiếu chọn không cho chơi nên không tính là người dùng.
  - name: dung_it
    share: 0.33             # tỉ lệ người dùng kiểu này
    uses_per_month: 3       # số phiên / người / tháng
    turns_per_session: 3    # số lượt hỏi trong một phiên
    source: "Khảo sát 20 phiếu, câu 7: 6/20 chọn chơi vài lần mỗi tháng. 'Vài lần' lấy là 3 lần (tự ước tính). Mỗi phiên 3 tình huống (tự ước tính)."
  - name: dung_vua
    share: 0.56
    uses_per_month: 6
    turns_per_session: 3
    source: "Khảo sát 20 phiếu, câu 7: 10/20 chọn 1–2 lần mỗi tuần, lấy trung bình 1,5 lần x 4 tuần = 6 phiên. Mỗi phiên 3 tình huống (tự ước tính)."
  - name: dung_nhieu
    share: 0.11
    uses_per_month: 280
    turns_per_session: 3
    source: "Khảo sát 20 phiếu, câu 7: 2/20 chọn cả lớp chơi nhiều lượt mỗi tuần. Một người dùng ở đây là một lớp: 35 học sinh x 2 buổi mỗi tuần x 4 tuần = 280 phiên (tự ước tính số học sinh và số buổi). Mỗi phiên 3 tình huống (tự ước tính)."
# Mỗi lượt hỏi lấy ngẫu nhiên một đầu vào trong eval/benchmark.csv (type thuong và kho).
# Persona hỏi kiểu riêng: thêm vào persona đó
#     types: [thuong, kho, tu_choi]
# hoặc
#     inputs: ["câu hỏi kiểu 1", "câu hỏi kiểu 2"]

prices:             # USD / 1 triệu token — chép từ further-reading/model-prices.md của repo đề. ≥2 mức model
  - model: openai/gpt-6-luna
    input: 0.10
    output: 0.50
    source: "Model đang dùng để đo token. https://openrouter.ai/openai/gpt-6-luna (giá chuẩn, khớp https://pricepertoken.com/pricing-page/model/openai-gpt-6-luna) · xem 28/11/2026. Trang OpenRouter có hiện mức 0,05 / 0,25 nhưng có vẻ là giá batch, nên lấy mức chuẩn."
  - model: anthropic/claude-sonnet-5.5
    input: 2.00
    output: 10.00
    source: "Mức model mạnh để so sánh. https://openrouter.ai/anthropic/claude-sonnet-5.5 · xem 28/11/2026"

usd_to_vnd:         # tuỳ chọn: điền thì bản tóm tắt in thêm tiền Việt
  rate:
  source:
