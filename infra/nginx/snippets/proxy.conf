# Header chung khi chuyển request vào backend / frontend.
# X-Forwarded-For GHI ĐÈ bằng IP thật Nginx thấy, không nối thêm vào header client tự gửi:
# backend dùng IP này để khoá dò mật khẩu và giới hạn tạo tài khoản, nối thêm thì client giả được IP.
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
