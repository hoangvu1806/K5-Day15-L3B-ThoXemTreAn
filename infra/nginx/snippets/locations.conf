# Các location dùng chung cho cổng 80 (chưa có TLS) và 443.

location = /metrics {
    return 403;
}

# Auth: ngưỡng theo IP vừa đủ cho cả lớp đăng nhập cùng lúc. Chặn dò mật khẩu theo tên đăng nhập nằm ở backend.
location ^~ /api/auth/ {
    limit_req zone=auth_limit burst=30 nodelay;
    client_max_body_size 16k;
    include /etc/nginx/snippets/proxy.conf;
    proxy_pass http://growsafe_api;
    proxy_read_timeout 15s;
}

# Nút khẩn cấp 111: KHÔNG áp limit_req để không bao giờ chặn trẻ gọi trợ giúp
location = /api/help {
    client_max_body_size 8k;
    include /etc/nginx/snippets/proxy.conf;
    proxy_pass http://growsafe_api;
    proxy_read_timeout 10s;
}

# Đọc to: mỗi câu Tin nói là một lượt, nên tách hạn mức khỏi các lượt gọi AI
location = /api/tts {
    limit_req zone=tts_limit burst=100 nodelay;
    client_max_body_size 8k;
    include /etc/nginx/snippets/proxy.conf;
    proxy_pass http://growsafe_api;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
}

# API AI, game, Góc Tò Mò & Healthcheck
location ~ ^/(api/|health$) {
    limit_req zone=api_limit burst=60 nodelay;
    client_max_body_size 32k;
    include /etc/nginx/snippets/proxy.conf;
    proxy_pass http://growsafe_api;
    proxy_connect_timeout 5s;
    proxy_send_timeout 15s;
    proxy_read_timeout 35s;
    proxy_next_upstream error timeout http_502 http_503;
}

# Cache dài hạn 1 năm cho ảnh, âm thanh và bundle tĩnh Next.js
location ~ ^/(assets/|_next/static/) {
    include /etc/nginx/snippets/proxy.conf;
    proxy_pass http://growsafe_frontend;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
}

# Giao diện Frontend Next.js
location / {
    include /etc/nginx/snippets/proxy.conf;
    proxy_pass http://growsafe_frontend;
    proxy_read_timeout 15s;
}
