user nginx;
worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 2048;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;

    # JSON access log ra stdout -> Promtail/Loki & Dozzle tự parse RPS, status, latency (rt, urt)
    log_format json_combined escape=json
      '{'
        '"time":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"method":"$request_method",'
        '"uri":"$uri",'
        '"status":$status,'
        '"bytes":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"upstream_time":"$upstream_response_time",'
        '"upstream_addr":"$upstream_addr"'
      '}';

    access_log /dev/stdout json_combined;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    # Nén response giảm băng thông
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # Chặn bot theo IP ở tầng edge. Ngưỡng để cao vì cả lớp học (~30 trẻ) thường ra Internet qua MỘT IP NAT;
    # giới hạn chặt theo từng tài khoản nằm ở backend (auth.require_ai_user, GROWSAFE_AI_RATE_LIMIT).
    # Nếu đặt Cloudflare phía trước: bật real_ip_header CF-Connecting-IP + set_real_ip_from dải IP Cloudflare,
    # không thì mọi người dùng chung IP của Cloudflare.
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=300r/m;
    limit_req_zone $binary_remote_addr zone=tts_limit:10m rate=600r/m;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=60r/m;
    limit_req_status 429;

    # DNS nội bộ của Docker: resolve lại "api" mỗi 10s để thấy replica mới / container được tạo lại.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Cân bằng tải least_conn (tối ưu cho AI request thời gian biến động 0.2s - 8s)
    upstream growsafe_api {
        zone growsafe_api 64k;
        least_conn;
        server api:6161 resolve max_fails=3 fail_timeout=15s;
        keepalive 32;
    }

    upstream growsafe_frontend {
        zone growsafe_frontend 64k;
        server frontend:3016 resolve max_fails=3 fail_timeout=15s;
        keepalive 16;
    }

    include /etc/nginx/conf.d/*.conf;
}
