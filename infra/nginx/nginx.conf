user nginx;
worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 2048;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;

    # JSON access log ra stdout -> Promtail/Loki & Dozzle tự parse RPS, status, latency (rt, urt)
    log_format json_combined escape=json
      '{'
        '"time":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"method":"$request_method",'
        '"uri":"$uri",'
        '"status":$status,'
        '"bytes":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"upstream_time":"$upstream_response_time",'
        '"upstream_addr":"$upstream_addr"'
      '}';

    access_log /dev/stdout json_combined;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    # Nén response giảm băng thông
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # Chống spam theo IP ở tầng Edge trước khi chạm tới Backend
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/m;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/m;
    limit_req_status 429;

    # Cân bằng tải least_conn (tối ưu cho AI request thời gian biến động 0.2s - 8s)
    upstream growsafe_api {
        least_conn;
        server api:6161 max_fails=3 fail_timeout=15s;
        keepalive 32;
    }

    upstream growsafe_frontend {
        server frontend:3000 max_fails=3 fail_timeout=15s;
        keepalive 16;
    }

    include /etc/nginx/conf.d/*.conf;
}
