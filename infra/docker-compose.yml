# GrowSafe AI — Production Docker Compose (Nginx + FastAPI + Next.js + Redis + Postgres + Observability)
# Chạy từ thư mục infra/ (hoặc qua scripts/compose.sh):
#   Cơ bản (Nginx + Frontend + API + Redis):   scripts/compose.sh up -d --build
#   Thêm xem log realtime nhẹ (Dozzle):        scripts/compose.sh --profile logs up -d
#   Đủ giám sát (Prometheus + Grafana + Loki): scripts/compose.sh --profile obs up -d
#   Dùng PostgreSQL có sẵn trên server:        scripts/compose.sh up -d --build   (tự thêm docker-compose.pg.yml)

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ---------- 1. Nginx Reverse Proxy + Load Balancer (least_conn) + Rate Limit ----------
  nginx:
    image: nginx:1.27.5-alpine  # >= 1.27.3 để dùng "server ... resolve" trong upstream
    restart: unless-stopped
    # Reload mỗi 6 giờ để nhận chứng chỉ certbot vừa gia hạn. Gọi qua /docker-entrypoint.sh để vẫn render template.
    entrypoint: ["/bin/sh", "-c", "(while :; do sleep 6h; nginx -s reload; done) & exec /docker-entrypoint.sh nginx -g 'daemon off;'"]
    command: []
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
      NGINX_ENVSUBST_FILTER: "^DOMAIN$"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # NGINX_SITE=https.conf.example trong .env.prod sau khi đã có chứng chỉ (không sửa file trong git)
      - ./nginx/${NGINX_SITE:-default.conf.template}:/etc/nginx/templates/default.conf.template:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_conf:/etc/letsencrypt:ro
    depends_on:
      frontend:
        condition: service_healthy
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8081/stub_status >/dev/null || exit 1"]
      interval: 20s
      timeout: 3s
      retries: 3
    networks:
      - edge
      - internal
    mem_limit: 96m
    logging: *default-logging

  # ---------- 1b. Gia hạn chứng chỉ Let's Encrypt (thử mỗi 12 giờ, chỉ gia hạn khi còn < 30 ngày) ----------
  certbot:
    image: certbot/certbot:v2.11.0
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c", "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done"]
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_conf:/etc/letsencrypt
    networks:
      - edge
    mem_limit: 64m
    logging: *default-logging

  # ---------- 2. Frontend Next.js ----------
  frontend:
    build:
      context: ..
      dockerfile: infra/Dockerfile.frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
    restart: unless-stopped
    expose:
      - "3016"
    networks:
      - internal
    mem_limit: 320m
    cpus: 0.75
    logging: *default-logging

  # ---------- 3. Backend FastAPI (AI Agent + Auth + TTS) ----------
  # Phiên, bản nháp, rate limit nằm ở Redis nên tăng API_REPLICAS / UVICORN_WORKERS được.
  # Nhiều tiến trình thì tài khoản phải nằm ở PostgreSQL (DATABASE_URL + docker-compose.pg.yml).
  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    restart: unless-stopped
    expose:
      - "6161"
    environment:
      MODEL_PROVIDER: ${MODEL_PROVIDER:-openrouter}
      MODEL_NAME: ${MODEL_NAME:-openai/gpt-6-luna}
      API_KEY: ${API_KEY:?Chua dien API_KEY trong infra/.env.prod}
      MODEL_TEMPERATURE: ${MODEL_TEMPERATURE:-0.3}
      SAFE_MODE: ${SAFE_MODE:-0}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      GROWSAFE_SHOW_DRAFT_SCENES: ${GROWSAFE_SHOW_DRAFT_SCENES:-0}
      GROWSAFE_AI_RATE_LIMIT: ${GROWSAFE_AI_RATE_LIMIT:-30}
      GROWSAFE_DB: /var/lib/growsafe/growsafe.db
      DATABASE_URL: ${DATABASE_URL:-}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      MODEL_TIMEOUT: ${MODEL_TIMEOUT:-20}
      GROWSAFE_THREADS: ${GROWSAFE_THREADS:-64}
      GROWSAFE_DB_POOL: ${GROWSAFE_DB_POOL:-10}
      GROWSAFE_REGISTER_LIMIT: ${GROWSAFE_REGISTER_LIMIT:-10}
      UVICORN_WORKERS: ${UVICORN_WORKERS:-1}
      GROWSAFE_SESSION_TTL: ${GROWSAFE_SESSION_TTL:-2700}
    volumes:
      - growsafe_data:/var/lib/growsafe
    depends_on:
      redis:
        condition: service_healthy
    stop_grace_period: 40s  # cho lượt đang gọi model chạy xong khi restart
    deploy:
      replicas: ${API_REPLICAS:-1}
      resources:
        limits:
          memory: ${API_MEM_LIMIT:-1g}  # mỗi worker nạp ADK + LiteLLM khoảng 250-350MB
          cpus: "${API_CPUS:-1.0}"
    networks:
      - internal
    logging: *default-logging

  # ---------- 4. Redis (phiên chơi, bản nháp, rate limit; TTL 45 phút, không ghi ra đĩa) ----------
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--maxmemory", "96mb", "--maxmemory-policy", "volatile-lru", "--save", ""]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 3s
      retries: 3
    networks:
      - internal
    mem_limit: 128m
    logging: *default-logging

  # ---------- 6. Log Viewer siêu nhẹ (~15MB RAM) — bật bằng --profile logs ----------
  dozzle:
    image: amir20/dozzle:v8.0.0
    profiles: ["logs"]
    restart: unless-stopped
    # Chỉ bind localhost trên VPS, truy cập qua SSH tunnel: ssh -L 8080:127.0.0.1:8080 user@vps
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - internal
    mem_limit: 64m
    logging: *default-logging

  # ---------- 7. Observability đầy đủ — bật bằng --profile obs ----------
  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.4.1
    profiles: ["obs"]
    restart: unless-stopped
    command: ["--nginx.scrape-uri=http://nginx:8081/stub_status"]
    depends_on:
      nginx:
        condition: service_healthy
    networks:
      - internal
    mem_limit: 32m
    logging: *default-logging

  prometheus:
    image: prom/prometheus:v3.2.1
    profiles: ["obs"]
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--storage.tsdb.retention.size=1GB"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prom_data:/prometheus
    networks:
      - internal
    mem_limit: 192m
    logging: *default-logging

  loki:
    image: grafana/loki:3.4.2
    profiles: ["obs"]
    restart: unless-stopped
    command: ["-config.file=/etc/loki/local-config.yaml"]
    volumes:
      - ./loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    networks:
      - internal
    mem_limit: 192m
    logging: *default-logging

  promtail:
    image: grafana/promtail:3.4.2
    profiles: ["obs"]
    restart: unless-stopped
    command: ["-config.file=/etc/promtail/config.yml"]
    volumes:
      - ./loki/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki
    networks:
      - internal
    mem_limit: 96m
    logging: *default-logging

  node-exporter:
    image: prom/node-exporter:v1.9.0
    profiles: ["obs"]
    restart: unless-stopped
    pid: host  # thấy tiến trình của VPS, không chỉ của container
    command:
      - "--path.rootfs=/host"
    volumes:
      - /:/host:ro,rslave
    networks:
      - internal
    mem_limit: 48m
    logging: *default-logging

  grafana:
    image: grafana/grafana:11.5.2
    profiles: ["obs"]
    restart: unless-stopped
    # Chỉ bind localhost trên VPS, truy cập an toàn qua SSH tunnel: ssh -L 3001:127.0.0.1:3001 user@vps
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?Chua dien GRAFANA_PASSWORD trong infra/.env.prod}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - ./grafana/provisioning/datasources/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
    networks:
      - internal
    mem_limit: 256m
    logging: *default-logging

networks:
  edge:
    driver: bridge
  internal:
    driver: bridge
    internal: false # API cần gọi ra ngoài tới OpenRouter; các service vẫn không expose port ra host
    ipam:
      config:
        - subnet: 172.28.0.0/16  # khớp FORWARDED_ALLOW_IPS trong Dockerfile.api: chỉ tin X-Forwarded-For từ đây

volumes:
  certbot_www:
  certbot_conf:
  growsafe_data:
  prom_data:
  loki_data:
  grafana_data:
